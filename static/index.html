<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKTA chromatography figure builder</title>
<style>
  :root {
    --ink: #16202b;
    --ink-2: #5a6976;
    --line: #d9e0e6;
    --card: #ffffff;
    --bg: #f4f7f9;
    --accent: #0d6b8a;
    --accent-soft: #e4f1f6;
    --ok: #1a7f4b;
    --bad: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  header {
    padding: 22px 28px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  header h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .2px; }
  header p { margin: 0; color: var(--ink-2); font-size: 13px; }
  main {
    display: grid;
    grid-template-columns: 380px minmax(0, 1fr);
    gap: 20px;
    padding: 20px 28px 40px;
    align-items: start;
  }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  .card + .card { margin-top: 14px; }
  h2 {
    margin: 0 0 12px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-2);
  }
  .segmented { display: flex; gap: 6px; margin-bottom: 14px; }
  .segmented button {
    flex: 1;
    padding: 9px 10px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink-2);
  }
  .segmented button.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  input[type=text], input[type=number] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 14px;
    color: var(--ink);
    background: #fff;
  }
  input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .field { margin-bottom: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .drop {
    border: 1.5px dashed var(--line);
    border-radius: 9px;
    padding: 14px;
    text-align: center;
    color: var(--ink-2);
    font-size: 13px;
    cursor: pointer;
    background: #fbfdfe;
  }
  .drop.hover { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { color: var(--ink); }
  .hint { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  button.primary {
    flex: 1;
    padding: 11px 14px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .6; cursor: progress; }
  button.ghost {
    padding: 11px 14px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 8px;
    color: var(--ink-2);
    cursor: pointer;
  }
  details summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--ink-2);
    margin-bottom: 10px;
  }
  .preview-empty {
    color: var(--ink-2);
    font-size: 14px;
    padding: 40px 10px;
    text-align: center;
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    background: #fff;
  }
  .figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
  figure {
    margin: 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
  }
  figure img { width: 100%; display: block; }
  figcaption {
    padding: 8px 10px;
    font-size: 12px;
    color: var(--ink-2);
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  figcaption a { color: var(--accent); text-decoration: none; }
  .status { font-size: 13px; margin-bottom: 12px; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); white-space: pre-wrap; }
  .saved { font-size: 12px; color: var(--ink-2); margin-top: 10px; }
  pre.log {
    margin: 12px 0 0;
    padding: 10px;
    background: #0f1b24;
    color: #cfe3ee;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.45;
    max-height: 220px;
    overflow: auto;
  }
  .links { margin-top: 10px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 14px; }
  .links a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>AKTA chromatography figure builder</h1>
  <p>IMAC and SEC exports &rarr; publication figures. Leave a range empty to let the script choose it.</p>
</header>

<main>
  <section>
    <div class="card">
      <h2>Technique</h2>
      <div class="segmented" id="technique">
        <button type="button" data-value="imac" class="active">IMAC</button>
        <button type="button" data-value="sec">SEC</button>
      </div>

      <h2>Data</h2>
      <div class="drop" id="drop">
        <strong>Drop a CSV here</strong><br>
        or click to choose the AKTA export
        <input type="file" id="file" accept=".csv,text/csv" hidden>
      </div>
      <p class="hint" id="file-hint">No file chosen.</p>

      <div class="field">
        <label for="csv-path">...or read a file already on this computer</label>
        <input type="text" id="csv-path" placeholder="C:\data\run 001.csv">
      </div>

      <div class="field">
        <label for="outdir">Output folder (blank: keep figures besides the CSV)</label>
        <input type="text" id="outdir" placeholder="C:\data\figures">
      </div>
    </div>

    <div class="card">
      <details open>
        <summary>Plot settings</summary>
        <div class="row">
          <div class="field">
            <label for="x-min">Volume start (mL)</label>
            <input type="text" id="x-min" placeholder="auto (0)">
          </div>
          <div class="field">
            <label for="x-max">Volume end (mL)</label>
            <input type="text" id="x-max" placeholder="auto">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="uv-min">UV low (mAU)</label>
            <input type="text" id="uv-min" placeholder="auto">
          </div>
          <div class="field">
            <label for="uv-max">UV high (mAU)</label>
            <input type="text" id="uv-max" placeholder="auto">
          </div>
        </div>
        <div class="row" id="elution-row">
          <div class="field">
            <label for="elution-min">Elution window start (mL)</label>
            <input type="text" id="elution-min" placeholder="auto">
          </div>
          <div class="field">
            <label for="elution-max">Elution window end (mL)</label>
            <input type="text" id="elution-max" placeholder="auto">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="fraction-y">Fraction label offset</label>
            <input type="text" id="fraction-y" placeholder="-0.065">
          </div>
          <div class="field">
            <label for="dpi">DPI</label>
            <input type="text" id="dpi" placeholder="300">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="width">Figure width (in)</label>
            <input type="text" id="width" placeholder="12">
          </div>
          <div class="field">
            <label for="height">Figure height (in)</label>
            <input type="text" id="height" placeholder="10">
          </div>
        </div>
      </details>
      <div class="actions">
        <button class="primary" id="render">Build figures</button>
        <button class="ghost" id="reset">Reset</button>
      </div>
    </div>
  </section>

  <section>
    <div class="card" id="result-card">
      <div class="status" id="status">Waiting for a CSV.</div>
      <div id="result"></div>
    </div>
  </section>
</main>

<script>
const state = { technique: "imac", file: null };

const el = (id) => document.getElementById(id);
const techButtons = [...document.querySelectorAll("#technique button")];

function setTechnique(value) {
  state.technique = value;
  techButtons.forEach((b) => b.classList.toggle("active", b.dataset.value === value));
  el("elution-row").style.display = value === "imac" ? "grid" : "none";
  el("x-min").placeholder = value === "imac" ? "auto (0)" : "auto (2.5)";
}
techButtons.forEach((b) => b.addEventListener("click", () => setTechnique(b.dataset.value)));

const drop = el("drop");
const fileInput = el("file");
drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("hover"); });
drop.addEventListener("dragleave", () => drop.classList.remove("hover"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("hover");
  if (e.dataTransfer.files.length) takeFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => { if (fileInput.files.length) takeFile(fileInput.files[0]); });

function takeFile(file) {
  if (!/\.csv$/i.test(file.name)) {
    setStatus("That is not a .csv file. AKTA exports end in .csv.", true);
    return;
  }
  state.file = file;
  el("file-hint").innerHTML = "<strong>" + file.name + "</strong> &middot; " +
    (file.size / 1024).toFixed(0) + " kB";
  el("csv-path").value = "";
  setStatus("Ready: " + file.name + " (" + state.technique.toUpperCase() + ").");
}

function setStatus(text, bad) {
  const s = el("status");
  s.textContent = text;
  s.className = "status" + (bad ? " bad" : "");
}

function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const bytes = new Uint8Array(reader.result);
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      resolve(btoa(binary));
    };
    reader.onerror = () => reject(new Error("Could not read the file."));
    reader.readAsArrayBuffer(file);
  });
}

el("reset").addEventListener("click", () => {
  ["x-min", "x-max", "uv-min", "uv-max", "elution-min", "elution-max",
   "fraction-y", "dpi", "width", "height", "csv-path", "outdir"].forEach((id) => { el(id).value = ""; });
  state.file = null;
  el("file-hint").textContent = "No file chosen.";
  el("result").innerHTML = "";
  setStatus("Waiting for a CSV.");
});

el("render").addEventListener("click", async () => {
  const csvPath = el("csv-path").value.trim();
  if (!state.file && !csvPath) {
    setStatus("Choose a CSV file or paste a path first.", true);
    return;
  }
  const button = el("render");
  button.disabled = true;
  setStatus("Running the analysis...");

  const payload = {
    technique: state.technique,
    csv_path: csvPath,
    outdir: el("outdir").value.trim(),
    x_min: el("x-min").value.trim(),
    x_max: el("x-max").value.trim(),
    uv_min: el("uv-min").value.trim(),
    uv_max: el("uv-max").value.trim(),
    elution_min: el("elution-min").value.trim(),
    elution_max: el("elution-max").value.trim(),
    fraction_label_y: el("fraction-y").value.trim(),
    dpi: el("dpi").value.trim(),
    width: el("width").value.trim(),
    height: el("height").value.trim(),
  };

  try {
    if (state.file) {
      payload.csv_name = state.file.name;
      payload.csv_b64 = await readAsBase64(state.file);
    }
    const response = await fetch("/api/render", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await response.json();
    if (!data.ok) {
      setStatus(data.error || "The analysis failed.", true);
      el("result").innerHTML = data.log ? "<pre class='log'>" + escapeHtml(data.log) + "</pre>" : "";
      return;
    }
    renderResult(data);
  } catch (err) {
    setStatus("Request failed: " + err.message, true);
  } finally {
    button.disabled = false;
  }
});

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function renderResult(data) {
  setStatus("Done: " + data.csv + " (" + data.technique.toUpperCase() + ").");
  const images = data.files.filter((f) => f.kind === "image");
  const reports = data.files.filter((f) => f.kind === "report");

  let html = "";
  if (images.length) {
    html += "<div class='figures'>";
    for (const img of images) {
      const label = img.name.includes("_noted") ? "Annotated (fraction numbers)" : "Clean";
      html += "<figure><img src='" + img.url + "&t=" + Date.now() + "' alt='" + escapeHtml(img.name) + "'>" +
        "<figcaption><span>" + escapeHtml(img.name) + " &middot; " + label + "</span>" +
        "<a href='" + img.url + "' download>download</a></figcaption></figure>";
    }
    html += "</div>";
  }
  if (reports.length) {
    html += "<div class='links'>" + reports.map((r) =>
      "<a href='" + r.url + "' target='_blank'>Open data report &rarr;</a>").join("") + "</div>";
  }
  if (data.saved_to) {
    html += "<p class='saved'>Saved to " + escapeHtml(data.saved_to) + "</p>";
  }
  if (data.log) {
    html += "<pre class='log'>" + escapeHtml(data.log) + "</pre>";
  }
  el("result").innerHTML = html;
}

setTechnique("imac");

// A CSV can be handed over in the URL: ?csv=<path>&tech=sec
const params = new URLSearchParams(window.location.search);
const presetCsv = params.get("csv");
const presetTech = params.get("tech");
const presetFields = {
  "x-min": params.get("x_min"), "x-max": params.get("x_max"),
  "uv-min": params.get("uv_min"), "uv-max": params.get("uv_max"),
  "elution-min": params.get("elution_min"), "elution-max": params.get("elution_max"),
  "fraction-y": params.get("fraction_y"), "dpi": params.get("dpi"),
  outdir: params.get("outdir"),
};
for (const [id, value] of Object.entries(presetFields)) {
  if (value !== null && value !== "") el(id).value = value;
}
if (presetTech === "sec" || presetTech === "imac") setTechnique(presetTech);
if (presetCsv) {
  el("csv-path").value = presetCsv;
  state.file = null;
  const short = presetCsv.split(/[\\/]/).pop();
  setStatus("Ready: " + short + " — building the figures...");
  setTimeout(() => el("render").click(), 150);
}
</script>
</body>
</html>
